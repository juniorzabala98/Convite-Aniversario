<script>
  var targetDate = new Date("2026-08-29T12:30:00-03:00").getTime();

  function pad(n){ return n < 10 ? "0" + n : "" + n; }

  function tick(){
    var now = Date.now();
    var diff = targetDate - now;
    if(diff <= 0){
      document.getElementById("c-days").textContent = "00";
      document.getElementById("c-hours").textContent = "00";
      document.getElementById("c-mins").textContent = "00";
      document.querySelector(".countdown-label").textContent = "É hoje!";
      return;
    }
    var days = Math.floor(diff / (1000*60*60*24));
    var hours = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
    var mins = Math.floor((diff % (1000*60*60)) / (1000*60));
    document.getElementById("c-days").textContent = pad(days);
    document.getElementById("c-hours").textContent = pad(hours);
    document.getElementById("c-mins").textContent = pad(mins);
  }
  tick();
  setInterval(tick, 60000);
</script>
